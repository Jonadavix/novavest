<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit — NovaVest</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
}

.box {
    background: white;
    max-width: 450px;
    margin: 50px auto;
    padding: 30px;
    border-radius: 15px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 18px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 14px;
    background: #1d4ed8;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

a {
    color: #1d4ed8;
}

.notice {
    background: #fff7ed;
    padding: 15px;
    margin-bottom: 20px;
    border-left: 4px solid #f97316;
}

</style>

</head>

<body>

<div class="box">

<h1>Deposit Request</h1>

<div class="notice">

Your request will remain <strong>Pending</strong>
until the deposit is independently verified.

</div>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<label>Amount (₦)</label>

<input
type="number"
name="amount"
min="1"
step="0.01"
placeholder="Enter amount"
required
>

<label>Payment Reference</label>

<input
type="text"
name="reference"
placeholder="Transaction/reference number"
>

<button type="submit">
Submit Deposit Request
</button>

</form>

<br>

<a href="/dashboard">← Back to Dashboard</a>

</div>

</body>
</html>
