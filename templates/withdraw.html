<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdrawal — NovaVest</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
}

.box {
    background: white;
    max-width: 450px;
    margin: 50px auto;
    padding: 30px;
    border-radius: 15px;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin: 8px 0 18px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 14px;
    background: #101828;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

.notice {
    background: #f0fdf4;
    padding: 15px;
    margin-bottom: 20px;
    border-left: 4px solid #16a34a;
}

a {
    color: #1d4ed8;
}

</style>

</head>

<body>

<div class="box">

<h1>Withdraw Funds</h1>

<div class="notice">

Withdrawals are reviewed before processing.
Only available account balance can be requested.

</div>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<label>Amount (₦)</label>

<input
type="number"
name="amount"
min="1"
step="0.01"
placeholder="Enter amount"
required
>

<label>Withdrawal Method</label>

<select name="method" required>

<option value="">Select method</option>

<option value="Bank Transfer">
Bank Transfer
</option>

</select>

<label>Account Details</label>

<input
type="text"
name="account_details"
placeholder="Bank account details"
required
>

<button type="submit">
Submit Withdrawal Request
</button>

</form>

<br>

<a href="/dashboard">← Back to Dashboard</a>

</div>

</body>
</html>
