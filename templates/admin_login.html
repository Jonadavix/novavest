<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login — NovaVest</title>

<style>

body {
    margin: 0;
    background: #101828;
    font-family: Arial, sans-serif;
}

.box {
    max-width: 420px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 8px 0 18px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #1d4ed8;
    color: white;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="box">

<h1>Administrator Login</h1>

<p>Authorized administrators only.</p>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<label>Email</label>

<input
type="email"
name="email"
required
>

<label>Password</label>

<input
type="password"
name="password"
required
>

<button type="submit">
Login
</button>

</form>

</div>

</body>

</html>
