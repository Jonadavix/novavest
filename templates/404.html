<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - NovaVest</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px 28px;
            margin: 20px;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        h1 {
            font-size: 64px;
            margin: 0;
        }

        h2 {
            margin: 10px 0;
        }

        p {
            color: #667085;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #172033;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
        Sorry, the page you're looking for doesn't exist
        or may have been moved.
    </p>

    <a href="{{ url_for('index') }}">Return Home</a>
</div>

</body>
</html>
