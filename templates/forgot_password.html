<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NovaVest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1f6feb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 6px;
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            background: #ffebee;
            color: #c62828;
            border-radius: 6px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f6feb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Forgot Password?</h1>

    <p>
        Enter the email address associated with your NovaVest account.
        We will generate a password reset request.
    </p>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a href="{{ url_for('login') }}" class="back">
        Back to Login
    </a>

</div>

</body>
</html>
